name: Robô Diário de Notícias

on:
  schedule:
    # Roda todo dia às 08:00 UTC (ajuste se necessário)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub quando quiser

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Robô
        run: python robo.py

      - name: Salvar e Commitar as Novas Notícias no Repositório
        run: |
          git config --global user.name "Robô de Notícias"
          git config --global user.email "robo@actions.github.com"
          git add -f historico_noticias.json
          git commit -m "Atualização automática de notícias via GitHub Actions [skip ci]" || exit 0
          git push